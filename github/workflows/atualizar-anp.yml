name: Atualizar precos ANP
on:
  schedule:
    - cron: '0 12 * * 1-6'
  workflow_dispatch:
    inputs:
      gravar:
        description: 'Gravar no Supabase? (sim ou nao)'
        default: 'nao'
permissions:
  contents: write
jobs:
  importar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install xlsx@0.18.5 --no-save
      - run: node scripts/importar-anp.mjs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          GRAVAR: ${{ github.event_name == 'schedule' && 'sim' || inputs.gravar }}
      - name: Guardar status
        run: |
          if [ -n "$(git status --porcelain dados-status.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add dados-status.json
            git commit -m "Atualiza status dos dados ANP"
            git push
          fi
